# XcodeGen spec for Calm Tasks for iPhone.
# Generate the Xcode project with `xcodegen generate`; the .xcodeproj is never committed.
name: CalmTasks
options:
  bundleIdPrefix: it.calmtasks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CODE_SIGN_STYLE: Automatic
    # Override on the command line for a personal team, e.g. CT_BUNDLE_PREFIX=it.calmtasks.giuseppe
    CT_BUNDLE_PREFIX: it.calmtasks
targets:
  CalmCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/CalmCore
    settings:
      base:
        PRODUCT_NAME: CalmCore
        PRODUCT_BUNDLE_IDENTIFIER: $(CT_BUNDLE_PREFIX).core
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
  CalmTasks:
    type: application
    platform: iOS
    sources:
      - path: Sources/CalmTasks
    dependencies:
      - target: CalmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CT_BUNDLE_PREFIX).app
        PRODUCT_NAME: CalmTasks
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Calm Tasks"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Per dettare i task a voce."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Per trasformare in testo i task che detti."
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CalmCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CalmCoreTests
      - path: Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: CalmCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CT_BUNDLE_PREFIX).core.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  CalmTasks:
    build:
      targets:
        CalmTasks: all
        CalmCoreTests: [test]
    test:
      targets:
        - CalmCoreTests
